name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      # Compiles the header under a strict -std=c11 -Werror, runs the suite
      # natively, then again under AddressSanitizer and UBSan with leak
      # detection on.
      - name: test-all
        run: make CC=${{ matrix.cc }} test-all

  # The _WIN32 branches are compiled and run nowhere else. wine is not a real
  # Windows machine, but it catches what never compiling at all cannot.
  windows-cross:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine

      - name: check-windows
        run: make check-windows
